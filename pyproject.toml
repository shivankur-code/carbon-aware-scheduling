[project]
name = "calf"
version = "0.0.1"
description = "Reliability- and uncertainty-aware carbon planning for LLM inference fleets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
opt = ["pulp>=2.8", "highspy>=1.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
