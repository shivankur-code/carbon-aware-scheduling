# Pilot: carbon-optimal GPU replacement lifetime, failure-aware vs failure-oblivious.
# Every parameter here is an ASSUMPTION (see docs/assumptions.md). Not a result to cite.
base:
  frontier_gpus: 1000
  embodied_kg_per_gpu: 1000
  avg_power_kw: 0.40
  idle_power_kw: 0.10
  pue: 1.2
  doubling_years: 3.5
  weibull_shape: 2.0
  mttr_hours: 72
  drain_fraction: 0.0
  unrepairable_fraction: 0.3
  part_embodied_fraction: 0.5
  pool_size: 64
  availability_target: 0.999
sweep:
  carbon_intensity_kg_per_kwh: {start: 0.01, stop: 0.70, num: 70}
  weibull_scale_years: [5, 8, 12]
output:
  csv: results/pilot_lifetime.csv
  figure: docs/figures/pilot_lifetime.png
