# G3: measured inputs for the reliability model: idle/spare power, cold-start time
# (software-failure repair time) and a kill-and-restart fault under load.
gpus: [0]
port: 8000
server:
  extra_args: ["--gpu-memory-utilization", "0.90", "--max-model-len", "8192"]
  ready_timeout_s: 3600
slo: {ttft_s: 2.0, tpot_s: 0.10}
workload: {input_median: 512, input_max: 4096, output_median: 256, output_max: 1024}
experiments:
  - {type: idle, model: Qwen/Qwen2.5-7B-Instruct, duration_s: 120, settle_s: 30}
  - {type: coldstart, model: Qwen/Qwen2.5-7B-Instruct, repeats: 5}
  - {type: fault, model: Qwen/Qwen2.5-7B-Instruct, kill_at_s: 120, duration_s: 480,
     load: {rate: 2.0}}
