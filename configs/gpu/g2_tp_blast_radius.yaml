# G2: tensor-parallel degree vs efficiency. A failure takes out a whole TP group, so TP
# degree = failure blast radius. Needs a 4- or 8-GPU node.
gpus: [0, 1, 2, 3]
port: 8000
server:
  extra_args: ["--gpu-memory-utilization", "0.90", "--max-model-len", "8192"]
  ready_timeout_s: 3600
slo: {ttft_s: 2.0, tpot_s: 0.10}
workload: {input_median: 512, input_max: 4096, output_median: 256, output_max: 1024}
experiments:
  - type: load
    models: [Qwen/Qwen2.5-7B-Instruct]
    tp: [1, 2, 4]
    caps: [1.0, 0.7]
    loads: [{concurrency: 16}, {concurrency: 64}]
    warmup_s: 90
    duration_s: 240
  - type: load
    name: load_32b
    models: [Qwen/Qwen2.5-32B-Instruct]
    tp: [2, 4]
    caps: [1.0, 0.7]
    loads: [{concurrency: 16}, {concurrency: 64}]
    warmup_s: 90
    duration_s: 240
